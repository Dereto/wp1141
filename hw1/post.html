<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="post-title">Blog Post</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .post-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 20px;
            line-height: 1.8;
            font-size: 1.1rem;
        }
        .post-content h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 1rem;
            color: #333;
        }
        .post-content h2 {
            font-size: 1.8rem;
            font-weight: 400;
            margin: 2rem 0 1rem 0;
            color: #333;
        }
        .post-content h3 {
            font-size: 1.4rem;
            font-weight: 500;
            margin: 1.5rem 0 0.5rem 0;
            color: #333;
        }
        .post-content p {
            margin-bottom: 1.5rem;
            color: #555;
        }
        .post-content ul, .post-content ol {
            margin-bottom: 1.5rem;
            padding-left: 2rem;
        }
        .post-content li {
            margin-bottom: 0.5rem;
            color: #555;
        }
        .post-content code {
            background-color: #f8f9fa;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        .post-content pre {
            background-color: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1.5rem 0;
        }
        .post-content pre code {
            background: none;
            padding: 0;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #666;
            text-decoration: none;
            margin-bottom: 2rem;
            transition: color 0.2s ease;
        }
        .back-link:hover {
            color: #333;
        }
        .post-meta-large {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            font-size: 1rem;
            color: #666;
        }
        .post-tags-large {
            display: flex;
            gap: 0.5rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        .post-tag-large {
            background-color: #f8f9fa;
            color: #666;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .post-tag-large:hover {
            background-color: #e9ecef;
            color: #333;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
            .post-content h1, .post-content h2, .post-content h3 {
                color: #e5e5e5;
            }
            .post-content p, .post-content li {
                color: #999;
            }
            .post-content code, .post-content pre {
                background-color: #2a2a2a;
                color: #e5e5e5;
            }
            .back-link {
                color: #999;
            }
            .back-link:hover {
                color: #e5e5e5;
            }
            .post-meta-large {
                color: #999;
            }
            .post-tag-large {
                background-color: #333;
                color: #999;
            }
            .post-tag-large:hover {
                background-color: #444;
                color: #e5e5e5;
            }
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-brand">
                <a href="index.html" class="brand-link">Blog</a>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="index.html#about" class="nav-link">About</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </div>
        </nav>
    </header>

    <main class="main">
        <div class="post-content">
            <a href="index.html" class="back-link">
                ← Back to all posts
            </a>
            
            <article id="post-article">
                <h1 id="post-heading">Loading...</h1>
                <div class="post-meta-large" id="post-meta">
                    <span id="post-date">Loading...</span>
                    <span>•</span>
                    <span id="post-read-time">Loading...</span>
                </div>
                
                <div id="post-body">
                    <p>Loading post content...</p>
                </div>
                
                <div class="post-tags-large" id="post-tags">
                    <!-- Tags will be populated here -->
                </div>
            </article>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Blog. All rights reserved.</p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="post.js"></script>
</body>
</html>
